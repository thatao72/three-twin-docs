<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>ThreeTwin Architecture</title>
  <meta name="description" content="ThreeTwin Architecture: governed measurement, learner-state inference, and educational action." />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root { color-scheme: light; --bg:#fff; --fg:#171717; --muted:#666; --border:#d8dee4; --code-bg:#f6f8fa; --link:#0969da; --content-width:1040px; }
    * { box-sizing:border-box; }
    html,body { background:#fff; }
    body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.65; }
    main { max-width:var(--content-width); margin:0 auto; padding:40px 28px 80px; }
    nav { display:flex; gap:1.2rem; align-items:center; padding-bottom:1.2rem; margin-bottom:2.2rem; border-bottom:1px solid var(--border); }
    nav .brand { font-weight:700; margin-right:auto; }
    nav a { color:var(--link); text-decoration:none; }
    h1 { font-size:2.35rem; line-height:1.12; margin:0 0 1.5rem; }
    h2 { margin-top:3.2rem; border-bottom:1px solid var(--border); padding-bottom:.35rem; }
    h3 { margin-top:2rem; }
    p,li { max-width:78ch; }
    a { color:var(--link); }
    code { background:var(--code-bg); padding:.12rem .3rem; border-radius:4px; }
    pre { overflow-x:auto; background:var(--code-bg); padding:1rem; border-radius:8px; }
    table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; margin:1.5rem 0; }
    th,td { border:1px solid var(--border); padding:.55rem .7rem; text-align:left; vertical-align:top; }
    blockquote { margin-left:0; padding-left:1rem; border-left:3px solid var(--border); color:var(--muted); }
    .status { color:var(--muted); margin-bottom:1.5rem; }
    .error { color:#b42318; white-space:pre-wrap; }
    .mermaid { margin:2rem 0; overflow-x:auto; background:#fff; padding:1rem; border-radius:8px; }
  </style>
</head>
<body>
  <main>
    <nav>
      <span class="brand">ThreeTwin Architecture</span>
      <a href="./">Overview</a>
      <a href="./?document=white-paper">Technical White Paper</a>
    </nav>
    <div class="status" id="status">Architecture documentation</div>
    <article id="content">Loading documentation…</article>
  </main>
  <script>
    mermaid.initialize({ startOnLoad:false, securityLevel:'loose', theme:'default',
      themeVariables:{ background:'#ffffff', primaryTextColor:'#171717', secondaryTextColor:'#171717', tertiaryTextColor:'#171717', lineColor:'#57606a' } });

    function escapeHtml(text) {
      return text.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    }
    function protectMath(markdown) {
      const math=[];
      const token=(value)=>`TTMATHPLACEHOLDER${math.push(value)-1}END`;
      let protectedMarkdown=markdown.replace(/\\\[([\s\S]*?)\\\]/g,(match)=>token(match));
      protectedMarkdown=protectedMarkdown.replace(/\\\(([\s\S]*?)\\\)/g,(match)=>token(match));
      return { markdown:protectedMarkdown, restore(html){ return html.replace(/TTMATHPLACEHOLDER(\d+)END/g,(_,index)=>escapeHtml(math[Number(index)])); } };
    }
    async function waitForMathJax(){ if(window.MathJax?.startup?.promise) await window.MathJax.startup.promise; }
    async function render(){
      const target=document.getElementById('content');
      const params=new URLSearchParams(window.location.search);
      const isWhitePaper=params.get('document')==='white-paper';
      const path=isWhitePaper?'./content/architecture/white-paper.md':'./content/architecture/overview.md';
      document.getElementById('status').textContent=isWhitePaper?'Technical White Paper':'Web Overview';
      try {
        const response=await fetch(path,{cache:'no-store'});
        if(!response.ok) throw new Error(`Unable to load documentation (${response.status})`);
        const markdown=await response.text();
        const protectedMath=protectMath(markdown);
        target.innerHTML=protectedMath.restore(marked.parse(protectedMath.markdown));
        const codeBlocks=[...target.querySelectorAll('pre code.language-mermaid')];
        for(const code of codeBlocks){ const pre=code.parentElement; const div=document.createElement('div'); div.className='mermaid'; div.textContent=code.textContent; pre.replaceWith(div); }
        await mermaid.run({querySelector:'.mermaid'});
        await waitForMathJax();
        if(window.MathJax?.typesetPromise) await window.MathJax.typesetPromise([target]);
      } catch(error) { target.innerHTML=`<div class="error">${error.message}</div>`; }
    }
    render();
  </script>
</body>
</html>
