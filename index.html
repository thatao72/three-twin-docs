<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>ThreeTwinArchitectureNext</title>
  <meta name="description" content="Architecture overview for ThreeTwinArchitectureNext: persistent educational memory, AI reasoning and action, learner feedback, and runtime traceability." />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --fg: #171717;
      --muted: #666666;
      --border: #d8dee4;
      --code-bg: #f6f8fa;
      --link: #0969da;
      --content-width: 1040px;
    }
    * { box-sizing: border-box; }
    html, body { background: #ffffff; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: var(--content-width);
      margin: 0 auto;
      padding: 48px 28px 80px;
    }
    h1 { font-size: 2.2rem; line-height: 1.15; margin: 0 0 1.5rem; }
    h2 { margin-top: 3rem; border-bottom: 1px solid var(--border); padding-bottom: .35rem; }
    h3 { margin-top: 2rem; }
    p, li { max-width: 78ch; }
    a { color: var(--link); }
    code {
      background: var(--code-bg);
      padding: .12rem .3rem;
      border-radius: 4px;
    }
    pre {
      overflow-x: auto;
      background: var(--code-bg);
      padding: 1rem;
      border-radius: 8px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      display: block;
      overflow-x: auto;
      margin: 1.5rem 0;
    }
    th, td {
      border: 1px solid var(--border);
      padding: .55rem .7rem;
      text-align: left;
      vertical-align: top;
    }
    blockquote {
      margin-left: 0;
      padding-left: 1rem;
      border-left: 3px solid var(--border);
      color: var(--muted);
    }
    .status { color: var(--muted); margin-bottom: 2rem; }
    .error { color: #b42318; white-space: pre-wrap; }
    .mermaid {
      margin: 2rem 0;
      overflow-x: auto;
      background: #ffffff;
      padding: 1rem;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <div class="status">ThreeTwinArchitectureNext architecture documentation</div>
    <article id="content">Loading architecture documentation…</article>
  </main>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: 'default',
      themeVariables: {
        background: '#ffffff',
        primaryTextColor: '#171717',
        secondaryTextColor: '#171717',
        tertiaryTextColor: '#171717',
        lineColor: '#57606a'
      }
    });

    async function render() {
      const target = document.getElementById('content');
      try {
        const response = await fetch('./content/architecture.md', { cache: 'no-store' });
        if (!response.ok) throw new Error(`Unable to load architecture.md (${response.status})`);
        const markdown = await response.text();
        target.innerHTML = marked.parse(markdown);

        const codeBlocks = [...target.querySelectorAll('pre code.language-mermaid')];
        for (const code of codeBlocks) {
          const pre = code.parentElement;
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = code.textContent;
          pre.replaceWith(div);
        }

        await mermaid.run({ querySelector: '.mermaid' });
        if (window.MathJax?.typesetPromise) await MathJax.typesetPromise([target]);
      } catch (error) {
        target.innerHTML = `<div class="error">${error.message}</div>`;
      }
    }

    render();
  </script>
</body>
</html>
